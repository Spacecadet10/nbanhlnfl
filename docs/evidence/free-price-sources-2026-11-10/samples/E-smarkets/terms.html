ink something will happen {br}Sell = you think it won't {br}{br}If you're right, you make a profit. If not, you lose the amount you traded. It's that simple.\",\"excw.onboarding.faq.trading.q\":\"How does trading on Smarkets work?\",\"excw.onboarding.first_order.cta\":\"Check your order status\",\"excw.onboarding.first_order.title\":\"Congratulations on placing your first order!\",\"excw.onboarding.q1.subtitle\":\"We'll use your answers to show you the most relevant tools, markets, and learning content — without limiting your experience. It won't affect fees or access.\",\"excw.onboarding.q1.title\":\"How familiar are you with betting or trading on sports or politics?\",\"excw.onboarding.q2.subtitle\":\"Final step, you're almost there. Please set up your trading preferences now.\",\"excw.onboarding.q2.title\":\"Set your preferences\",\"excw.onboarding.returning.benefits.description\":\"We've redesigned Smarkets.com so you can trade faster and with more confidence across our wide range of sports and politics markets.\",\"excw.onboarding.returning.benefits.title\":\"{name}, welcome to the best sports trading experience\",\"excw.onboarding.returning.bet-cta.both.note\":\"Best for experienced traders. A more detailed user interface that gives you more information such as the buy/sell spread.\",\"excw.onboarding.returning.bet-cta.buy.note\":\"Best for new traders. A simple user interface that only displays the Buy prices from the order book.\",\"excw.onboarding.returning.bet-cta.description\":\"Pick the view that best fits your trading style.\\nYou can always switch the order type in the order slip or preferences.\",\"excw.onboarding.returning.bet-cta.sell.note\":\"Best for matched bettors and arbers. A simple user interface that only displays the Sell prices from the order book.\",\"excw.onboarding.returning.bet-cta.title\":\"Trade your way: choose the prices you see\",\"excw.onboarding.returning.changes.title\":\"Explore the key changes\",\"excw.onboarding.returning.platform-insights\":\"Platform Insights\",\"excw.onboarding.returning.platform-insights.description\":\"Spot opportunities faster by knowing what other traders are buying and selling. See which contracts are trending, track the top movers, as well as real-time buy/sell activity across the exchange.\",\"excw.onboarding.returning.platform-insights.title\":\"Spot opportunities faster by knowing what other traders are buying and selling. See which contracts are trending, track the top movers, as well as real-time buy/sell activity across the exchange. \",\"excw.onboarding.returning.smart-betslip\":\"Smart Betslip\",\"excw.onboarding.returning.smart-betslip.description\":\"The redesigned betslip comes with built-in navigation, market and limit order options, and full visibility of how much is available to trade on any given contract.\",\"excw.onboarding.returning.theme.description\":\"Smarkets now comes in two styles: our classic dark theme as well as a crisp new light theme. You can always change this from your account menu in the top right.\",\"excw.onboarding.returning.theme.title\":\"Choose Your Side: Light or Dark Theme\",\"excw.onboarding.returning.trading-portfolio\":\"Trading Portfolio\",\"excw.onboarding.returning.trading-portfolio.description\":\"Know exactly where you stand. From your PnL statement to exposure, your entire trading picture is now clearer, faster, and built to give you the edge.\",\"excw.onboarding.start_trading\":\"Start trading\",\"excw.onboarding.step.deposit\":\"Make first deposit\",\"excw.onboarding.step.place_order\":\"Place a buy/sell order\",\"excw.onboarding.step.place_order.hint\":\"Confirm your buy or sell to open a trade on the selected outcome.\",\"excw.onboarding.step.select_outcome\":\"Select an outcome\",\"excw.onboarding.step.select_outcome.hint\":\"Click Buy or Sell on a contact that interests you\",\"excw.onboarding.step.signup\":\"Sign up\",\"excw.onboarding.step.tour\":\"Take a tour\",\"excw.onboarding.step.tour.cta\":\"Show m
