[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-predictor-backend"
version = "0.1.0"
description = "FastAPI service for the NBA prediction app (demo API + SQLite data store)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
  "pypdf>=4,<6",
  "scikit-learn>=1.5,<2",  # prospective research candidates
]

[project.optional-dependencies]
dev = ["pytest>=8"]
research = ["catboost==1.2.10"]  # docs/MODEL_SELECTION.md §10; never imported by live paths

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]
