[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-predictor-backend"
version = "0.1.0"
description = "FastAPI service for the NBA prediction app (demo API + SQLite data store)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.5,<2"]  # scikit-learn: research candidates only; the API and jobs never import it

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]
